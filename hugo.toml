baseURL = 'https://dbgate.io/'
title = 'DbGate'
disableKinds = ["taxonomy"]
enableRobotsTXT = true
theme = "hugo-theme-relearn"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableMissingTranslationPlaceholders = false

# Only languages with actually translated content belong here. A language whose
# contentDir is empty falls back to English, publishing untranslated duplicates
# under its prefix and adding a dead entry to the switcher.
# Weights match web-dbgate-io.
[languages]
  [languages.en]
    languageName = 'English'
    languageCode = 'en-us'
    weight = 10
    contentDir = 'content/en'
  [languages.cs]
    languageName = 'Česky'
    languageCode = 'cs'
    weight = 20
    contentDir = 'content/cs'
  [languages.de]
    languageName = 'Deutsch'
    languageCode = 'de'
    weight = 30
    contentDir = 'content/de'
  [languages.fr]
    languageName = 'Français'
    languageCode = 'fr'
    weight = 40
    contentDir = 'content/fr'
  [languages.es]
    languageName = 'Español'
    languageCode = 'es'
    weight = 50
    contentDir = 'content/es'
  [languages.sk]
    languageName = 'Slovensky'
    languageCode = 'sk'
    weight = 60
    contentDir = 'content/sk'
  [languages.zh]
    languageName = '简体中文'
    weight = 70
    contentDir = 'content/zh'
  [languages.pt]
    languageName = 'Português'
    languageCode = 'pt-br'
    weight = 80
    contentDir = 'content/pt'
  [languages.it]
    languageName = 'Italiano'
    languageCode = 'it'
    weight = 90
    contentDir = 'content/it'
  [languages.ja]
    languageName = '日本語'
    languageCode = 'ja'
    weight = 100
    contentDir = 'content/ja'
  [languages.ko]
    languageName = '한국어'
    languageCode = 'ko'
    weight = 110
    contentDir = 'content/ko'

[module]
  [module.hugoVersion]
    extended = false
    min = "0.116.0"

[pagination]
  disableAliases = false
  pagerSize = 50
  path = 'page'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[sitemap]
  exclude = ["purchase"]

[params]
  themeVariant = 'dbgate'